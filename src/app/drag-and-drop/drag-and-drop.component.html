<div class="container">
  <h2>Chapters</h2>
<div>vishal deep ----------------------<div>
  <div cdkDropList class="chapter-list" (cdkDropListDropped)="onDrop($event)" >
 

    <div *ngFor="let chapter of chapters ; let i = index" class="chapter-item" cdkDrag [cdkDragBoundary]="'.container'">
    

      <span><b>order:</b>{{chapter.order }} &nbsp;&nbsp;<b>chapter:</b> {{ chapter.name }}</span>

    </div>
  </div>
</div>










   <!-- cdkDropList is a directive provided by Angular CDK (Component Dev Kit) for managing drag-and-drop lists.
     It makes an element a drop container, meaning it can accept draggable items like(cdkDrag). -->
  <!-- cdkDrag : represent draggable item 
       cdkDrag makes an element draggable inside a cdkDropList.
Without cdkDrag, elements cannot be moved within the list. -->

 <!-- 
cdkDropList makes the div.chapter-list a drop container.
cdkDrag makes each div.chapter-item draggable within the list.
(cdkDropListDropped)="onDrop($event)" triggers the onDrop() function when an item is dropped after dragging.
 -->
<!-- 
Understanding (cdkDropListDropped)="onDrop($event)"
This listens to the cdkDropListDropped event and calls onDrop($event). 
$event contains details about the drag-and-drop action (such as previous and new positions)
-->

moveItemInArray is a predefined function from Angular CDK that rearranges items in an array.
